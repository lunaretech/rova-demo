name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Instância do Rova e embed do agente `piloto`. O id é público por natureza; o Rova só aceita
  # chamadas vindas dos domínios listados no embed. Deixe os dois vazios para desligar o assistente.
  VITE_ROVA_BASE_URL: https://rova.lunare.tech
  VITE_ROVA_EMBED_ID: 0cb3cd59-b1d9-4ea7-82aa-95afe68c4858

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
